plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.vova.kitchentimer'
    compileSdk 35

    defaultConfig {
        applicationId 'dev.vova.kitchentimer'
        minSdk 23
        targetSdk 30
        versionCode 1
        versionName '1.0.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
