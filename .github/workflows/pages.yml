name: Publish ORBITA
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      stackblitz_artifact: ${{ steps.stackblitz.outputs.artifact-id }}
      preview_artifact: ${{ steps.preview.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run tokens:check && npm run typecheck && npm run test && npm run test:deployment
      - name: Build website
        run: npm run build
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Build direct StackBlitz import
        run: npm run export:stackblitz
      - uses: actions/upload-artifact@v4
        id: stackblitz
        with:
          name: orbita-stackblitz
          path: stackblitz-export/orbita-stackblitz.html
      - name: Build downloadable preview
        run: npm run build:preview
      - uses: actions/upload-artifact@v4
        id: preview
        with:
          name: orbita-preview
          path: standalone-dist/orbita-preview.html
  deploy:
    needs: build
    runs-on: ubuntu-latest
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
  verify:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    outputs:
      smoke_artifact: ${{ steps.smoke.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Locate browser
        id: browser
        run: |
          if command -v google-chrome > /dev/null; then
            orbita_browser_path="$(command -v google-chrome)"
          elif command -v chromium > /dev/null; then
            orbita_browser_path="$(command -v chromium)"
          else
            npx playwright install --with-deps chromium
            orbita_browser_path="$(node --input-type=module -e 'import { chromium } from "@playwright/test"; process.stdout.write(chromium.executablePath())')"
          fi
          echo "path=$orbita_browser_path" >> "$GITHUB_OUTPUT"
      - name: Verify published website in browser
        run: npm run test:production
        env:
          PREVIEW_URL: ${{ needs.deploy.outputs.page_url }}
          CHROMIUM_PATH: ${{ steps.browser.outputs.path }}
          PRODUCTION_EVIDENCE_DIR: ${{ runner.temp }}/orbita-live-evidence
      - uses: actions/upload-artifact@v4
        id: smoke
        if: always()
        with:
          name: orbita-live-smoke
          path: ${{ runner.temp }}/orbita-live-evidence
  inspect:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: read
    steps:
      - uses: actions/checkout@v4
      - name: Check publication before deployment
        run: node scripts/deployment-status.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DEPLOYMENT_PHASE: preflight
          DEPLOYMENT_STATUS_OUTPUT: ${{ runner.temp }}/orbita-deployment.json
      - name: Save publication receipt
        env:
          RECEIPT: ${{ runner.temp }}/orbita-deployment.json
        run: |
          if git ls-remote --exit-code --heads origin deployment-status > /dev/null; then
            git fetch origin deployment-status
            git switch --detach FETCH_HEAD
          fi
          cp "$RECEIPT" deployment-status.json
          git add deployment-status.json
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Record Pages publication preflight'
          git push origin HEAD:deployment-status
  receipt:
    if: always()
    needs: [build, deploy, inspect, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: read
    steps:
      - uses: actions/checkout@v4
      - name: Check completed publication
        run: node scripts/deployment-status.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DEPLOYMENT_PHASE: complete
          BUILD_RESULT: ${{ needs.build.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          VERIFY_RESULT: ${{ needs.verify.result }}
          STACKBLITZ_ARTIFACT_ID: ${{ needs.build.outputs.stackblitz_artifact }}
          PREVIEW_ARTIFACT_ID: ${{ needs.build.outputs.preview_artifact }}
          LIVE_SMOKE_ARTIFACT_ID: ${{ needs.verify.outputs.smoke_artifact }}
          DEPLOYMENT_STATUS_OUTPUT: ${{ runner.temp }}/orbita-deployment.json
      - name: Save publication receipt
        env:
          RECEIPT: ${{ runner.temp }}/orbita-deployment.json
        run: |
          if git ls-remote --exit-code --heads origin deployment-status > /dev/null; then
            git fetch origin deployment-status
            git switch --detach FETCH_HEAD
          fi
          cp "$RECEIPT" deployment-status.json
          git add deployment-status.json
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Record completed Pages publication'
          git push origin HEAD:deployment-status
